data:
  # dataset_root is used as the base for resolving audio paths (pub/kk/audio/...)
  # JSONL files live in signer_format/ and are referenced via ../signer_format/
  dataset_root: data/ca_stner
  train_file: ../ca_stner_signer/train.jsonl
  dev_file: ../ca_stner_signer/dev.jsonl
  test_file: ../ca_stner_signer/test.jsonl
  sample_rate: 16000
  max_audio_seconds: 30.0
  max_text_length: 256
  train_default_view: text-only
  view_for_eval: text-only
  sample_training_views: false
  train_view_probs:
    text-only: 1.0

model:
  whisper_name_or_path: openai/whisper-small
  speech_encoder_type: whisper
  text_model_name_or_path: xlm-roberta-base
  hidden_size: 768
  dropout: 0.1
  use_speech_branch: false
  freeze_speech_encoder: true
  freeze_text_encoder: false

training:
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 10
  max_steps: null
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1
  consistency_weight: 0.0
  audio_dropout: 0.0
  text_dropout: 0.0
  device: cuda
  output_dir: outputs/ca_stner/text_xlmr
  log_every_steps: 50
  num_workers: 4
  seed: 42
  positive_example_oversampling: 2.0
  non_o_loss_weight: 3.0
